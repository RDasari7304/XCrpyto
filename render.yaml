# Render blueprint. Two services on one image plus a managed Postgres.
databases:
  - name: xcrypto-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: xcrypto
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: ESCROW_ENABLED
        value: "false"
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: DATABASE_URL
        fromDatabase:
          name: xcrypto-db
          property: connectionString
      - key: SESSION_PEPPER
        generateValue: true
      # Set these in the dashboard, not here:
      #   BASE_URL, WEB_ORIGIN, X_CLIENT_ID, X_CLIENT_SECRET,
      #   X_BOT_TOKEN, X_BOT_USER_ID, X_BOT_HANDLE
      - key: BASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: X_BOT_TOKEN
        sync: false
      - key: X_BOT_USER_ID
        sync: false
      - key: X_BOT_HANDLE
        sync: false

  - type: worker
    name: xcrypto-worker
    runtime: docker
    plan: starter
    dockerCommand: npm run start:workers
    envVars:
      - key: NODE_ENV
        value: production
      - key: ESCROW_ENABLED
        value: "false"
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: DATABASE_URL
        fromDatabase:
          name: xcrypto-db
          property: connectionString
      - key: SESSION_PEPPER
        fromService:
          name: xcrypto
          type: web
          envVarKey: SESSION_PEPPER
      - key: BASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: X_BOT_TOKEN
        sync: false
      - key: X_BOT_USER_ID
        sync: false
      - key: X_BOT_HANDLE
        sync: false
